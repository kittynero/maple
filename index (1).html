<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메이플 주보 수익계산기</title>
<style>
  :root{
    --bg:#0f1116; --card:#1a1d26; --card2:#222633; --line:#2e3345;
    --text:#e8eaf2; --sub:#9aa1b5; --accent:#ff9a3c; --accent2:#ffd166;
    --green:#4ade80; --red:#f87171; --blue:#60a5fa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI','Malgun Gothic',sans-serif; padding:16px; max-width:1100px; margin:0 auto;}
  h1{font-size:22px; margin:8px 0 16px; color:var(--accent2);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  button{background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent); color:#1a1206; font-weight:700; border:none;}
  button.danger{color:var(--red);}
  input,select{background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;}
  input:focus,select:focus{outline:none; border-color:var(--accent);}
  .total-banner{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .total-banner .big{font-size:28px; font-weight:800; color:var(--accent2);}
  .sub{color:var(--sub); font-size:12px;}
  .month-nav{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700;}
  .month-nav button{padding:4px 12px; font-size:16px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--sub); font-weight:600;}
  td input[type=number]{width:130px;}
  .badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700;}
  .b-이지{background:#14532d; color:#86efac;}
  .b-노멀{background:#1e3a8a; color:#93c5fd;}
  .b-하드{background:#7f1d1d; color:#fca5a5;}
  .b-카오스{background:#4c1d95; color:#c4b5fd;}
  .b-익스트림{background:#450a0a; color:#f87171; border:1px solid #f87171;}
  .b-월간{background:#78350f; color:#fcd34d;}
  details summary{cursor:pointer; font-weight:700; padding:4px 0; list-style:none;}
  details summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}
  .char-card{border-left:4px solid var(--accent);}
  .char-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .char-name{font-size:17px; font-weight:800;}
  .char-meta{font-size:12px; color:var(--sub);}
  .char-sub{font-size:15px; font-weight:700; color:var(--green);}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px;}
  .cal .dow{text-align:center; font-size:11px; color:var(--sub); padding:4px 0;}
  .cal .day{min-height:56px; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:4px; cursor:pointer; font-size:11px; position:relative;}
  .cal .day:hover{border-color:var(--accent);}
  .cal .day.empty{background:transparent; border:none; cursor:default;}
  .cal .day.today{border-color:var(--accent2);}
  .cal .day.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .cal .day .dnum{color:var(--sub);}
  .cal .day .dval{color:var(--green); font-weight:700; font-size:10px; word-break:break-all; margin-top:2px;}
  .day-panel{background:var(--card2); border:1px solid var(--accent); border-radius:10px; padding:12px; margin-top:10px;}
  .boss-pick{display:flex; flex-wrap:wrap; gap:6px; max-height:220px; overflow-y:auto; margin:8px 0;}
  .boss-pick label{display:flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:12px; cursor:pointer;}
  .boss-pick label.on{border-color:var(--accent); background:#2a2415;}
  .party-sel{padding:2px 4px; font-size:11px; border-radius:6px;}
  .misc-row{display:flex; gap:6px; margin:4px 0; align-items:center;}
  .msg{font-size:12px; margin-top:6px;}
  .msg.err{color:var(--red);} .msg.ok{color:var(--green);}
  .confirm2{background:var(--red)!important; color:#fff!important;}
  @media(max-width:600px){ td input[type=number]{width:90px;} .total-banner .big{font-size:22px;} }
</style>
</head>
<body>
<h1>🍁 메이플 주보 수익계산기</h1>

<!-- 월 네비게이션 + 총수익 -->
<div class="card total-banner">
  <div class="month-nav">
    <button onclick="moveMonth(-1)">‹</button>
    <span id="monthLabel"></span>
    <button onclick="moveMonth(1)">›</button>
  </div>
  <div style="text-align:right">
    <div class="sub">전체 캐릭터 총 월간수익</div>
    <div class="big" id="grandTotal">0 메소</div>
  </div>
</div>

<!-- API 설정 -->
<div class="card">
  <details>
    <summary>⚙️ 넥슨 오픈 API 설정</summary>
    <div class="row" style="margin-top:10px">
      <input type="password" id="apiKey" placeholder="넥슨 오픈 API 키 입력" style="flex:1; min-width:220px">
      <button class="primary" onclick="saveApiKey()">키 저장</button>
      <button onclick="fetchCharacterList()">계정 캐릭터 목록 불러오기</button>
    </div>
    <div class="sub" style="margin-top:6px">
      키 발급: <a href="https://openapi.nexon.com" target="_blank" style="color:var(--blue)">openapi.nexon.com</a> → 내 애플리케이션 등록 후 발급. 키는 이 브라우저(localStorage)에만 저장됩니다.
    </div>
    <div id="apiMsg" class="msg"></div>
    <div id="charListArea" style="display:none; margin-top:8px" class="row">
      <select id="charSelect" style="flex:1; min-width:220px"></select>
      <button class="primary" onclick="addSelectedCharacter()">선택한 캐릭터 추가</button>
    </div>
  </details>
</div>

<!-- 시세표 -->
<div class="card">
  <details>
    <summary>💎 보스 결정석 시세표 (수정 가능)</summary>
    <div class="row" style="margin:10px 0">
      <input id="newBossName" placeholder="보스 이름">
      <select id="newBossDiff"><option>이지</option><option>노멀</option><option>하드</option><option>카오스</option><option>익스트림</option></select>
      <input id="newBossPrice" type="number" placeholder="가격(메소)">
      <select id="newBossCycle"><option value="weekly">주간</option><option value="monthly">월간</option></select>
      <button onclick="addBoss()">보스 추가</button>
      <button class="danger" id="resetPricesBtn" onclick="confirmTwice(this, resetPrices)">시세 초기화</button>
    </div>
    <div style="overflow-x:auto"><table id="priceTable"></table></div>
    <div class="sub" style="margin-top:6px">※ 시세는 패치로 계속 변동되니 실제 게임 내 가격에 맞게 직접 수정해서 쓰세요.</div>
  </details>
</div>

<!-- 캐릭터 목록 -->
<div id="charContainer"></div>
<div class="row" style="margin-bottom:40px">
  <input id="manualCharName" placeholder="캐릭터 이름 직접 입력">
  <button class="primary" onclick="addManualCharacter()">＋ 캐릭터 추가</button>
</div>

<script>
/* ================= 기본 시세 데이터 ================= */
const DEFAULT_BOSSES = [
  {name:"자쿰", diff:"카오스", price:4040000, cycle:"weekly"},
  {name:"블러디퀸", diff:"카오스", price:4070000, cycle:"weekly"},
  {name:"반반", diff:"카오스", price:4070000, cycle:"weekly"},
  {name:"피에르", diff:"카오스", price:4080000, cycle:"weekly"},
  {name:"매그너스", diff:"하드", price:4280000, cycle:"weekly"},
  {name:"벨룸", diff:"카오스", price:4640000, cycle:"weekly"},
  {name:"파풀라투스", diff:"카오스", price:6550000, cycle:"weekly"},
  {name:"스우", diff:"노멀", price:8350000, cycle:"weekly"},
  {name:"데미안", diff:"노멀", price:8750000, cycle:"weekly"},
  {name:"가디언 엔젤 슬라임", diff:"노멀", price:12700000, cycle:"weekly"},
  {name:"루시드", diff:"이지", price:14900000, cycle:"weekly"},
  {name:"윌", diff:"이지", price:16100000, cycle:"weekly"},
  {name:"루시드", diff:"노멀", price:17800000, cycle:"weekly"},
  {name:"윌", diff:"노멀", price:20500000, cycle:"weekly"},
  {name:"더스크", diff:"노멀", price:22000000, cycle:"weekly"},
  {name:"듄켈", diff:"노멀", price:23700000, cycle:"weekly"},
  {name:"데미안", diff:"하드", price:46400000, cycle:"weekly"},
  {name:"스우", diff:"하드", price:48900000, cycle:"weekly"},
  {name:"루시드", diff:"하드", price:59700000, cycle:"weekly"},
  {name:"더스크", diff:"카오스", price:66300000, cycle:"weekly"},
  {name:"진 힐라", diff:"노멀", price:67600000, cycle:"weekly"},
  {name:"가디언 엔젤 슬라임", diff:"카오스", price:71300000, cycle:"weekly"},
  {name:"윌", diff:"하드", price:73200000, cycle:"weekly"},
  {name:"듄켈", diff:"하드", price:89600000, cycle:"weekly"},
  {name:"진 힐라", diff:"하드", price:100000000, cycle:"weekly"},
  {name:"선택받은 세렌", diff:"노멀", price:167000000, cycle:"weekly"},
  {name:"감시자 칼로스", diff:"이지", price:238000000, cycle:"weekly"},
  {name:"최초의 대적자", diff:"이지", price:261000000, cycle:"weekly"},
  {name:"선택받은 세렌", diff:"하드", price:302000000, cycle:"weekly"},
  {name:"카링", diff:"이지", price:320000000, cycle:"weekly"},
  {name:"벨로나", diff:"이지", price:396000000, cycle:"weekly"},
  {name:"감시자 칼로스", diff:"노멀", price:479000000, cycle:"weekly"},
  {name:"최초의 대적자", diff:"노멀", price:532000000, cycle:"weekly"},
  {name:"스우", diff:"익스트림", price:545000000, cycle:"weekly"},
  {name:"찬란한 흉성", diff:"노멀", price:576000000, cycle:"weekly"},
  {name:"카링", diff:"노멀", price:593000000, cycle:"weekly"},
  {name:"벨로나", diff:"노멀", price:824000000, cycle:"weekly"},
  {name:"림보", diff:"노멀", price:995000000, cycle:"weekly"},
  {name:"감시자 칼로스", diff:"카오스", price:1230000000, cycle:"weekly"},
  {name:"발드릭스", diff:"노멀", price:1320000000, cycle:"weekly"},
  {name:"최초의 대적자", diff:"하드", price:1390000000, cycle:"weekly"},
  {name:"유피테르", diff:"노멀", price:1560000000, cycle:"weekly"},
  {name:"카링", diff:"하드", price:1560000000, cycle:"weekly"},
  {name:"선택받은 세렌", diff:"익스트림", price:1840000000, cycle:"weekly"},
  {name:"림보", diff:"하드", price:2385000000, cycle:"weekly"},
  {name:"찬란한 흉성", diff:"하드", price:2678000000, cycle:"weekly"},
  {name:"벨로나", diff:"하드", price:2950000000, cycle:"weekly"},
  {name:"발드릭스", diff:"하드", price:3078000000, cycle:"weekly"},
  {name:"감시자 칼로스", diff:"익스트림", price:4104000000, cycle:"weekly"},
  {name:"최초의 대적자", diff:"익스트림", price:4712000000, cycle:"weekly"},
  {name:"유피테르", diff:"하드", price:4845000000, cycle:"weekly"},
  {name:"카링", diff:"익스트림", price:5387000000, cycle:"weekly"},
  {name:"검은 마법사", diff:"하드", price:465000000, cycle:"monthly"},
  {name:"검은 마법사", diff:"익스트림", price:5680000000, cycle:"monthly"},
];

/* ================= 상태 ================= */
const LS_KEY = "mapleBossCalcV3";
let state = load();
let viewYear, viewMonth; // 현재 보고 있는 달
{ const now = new Date(); viewYear = now.getFullYear(); viewMonth = now.getMonth(); }
let selectedDay = {}; // charId -> "YYYY-MM-DD"

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s && s.bosses && s.chars) return s;
  }catch(e){}
  return { bosses: JSON.parse(JSON.stringify(DEFAULT_BOSSES)), chars: [], apiKey: "" };
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function bossKey(b){ return b.name + "|" + b.diff; }
function fmt(n){ return n.toLocaleString("ko-KR") + " 메소"; }

/* ================= 시세표 ================= */
function renderPriceTable(){
  const t = document.getElementById("priceTable");
  let html = "<tr><th>보스</th><th>난이도</th><th>주기</th><th>결정석 가격</th><th></th></tr>";
  state.bosses.forEach((b,i)=>{
    html += `<tr>
      <td>${b.name}</td>
      <td><span class="badge b-${b.diff}">${b.diff}</span>${b.cycle==="monthly"?' <span class="badge b-월간">월간</span>':""}</td>
      <td>${b.cycle==="monthly"?"월간":"주간"}</td>
      <td><input type="number" value="${b.price}" onchange="updatePrice(${i}, this.value)"></td>
      <td><button class="danger" onclick="removeBoss(${i})">삭제</button></td>
    </tr>`;
  });
  t.innerHTML = html;
}
function updatePrice(i,v){ state.bosses[i].price = Number(v)||0; save(); renderAll(); }
function removeBoss(i){ state.bosses.splice(i,1); save(); renderAll(); }
function addBoss(){
  const name = document.getElementById("newBossName").value.trim();
  const diff = document.getElementById("newBossDiff").value;
  const price = Number(document.getElementById("newBossPrice").value)||0;
  const cycle = document.getElementById("newBossCycle").value;
  if(!name) return;
  state.bosses.push({name, diff, price, cycle});
  document.getElementById("newBossName").value=""; document.getElementById("newBossPrice").value="";
  save(); renderAll();
}
function resetPrices(){ state.bosses = JSON.parse(JSON.stringify(DEFAULT_BOSSES)); save(); renderAll(); }

/* 2번 눌러 확인 (팝업 없이) */
function confirmTwice(btn, fn){
  if(btn.dataset.armed){ btn.dataset.armed=""; btn.classList.remove("confirm2"); btn.textContent=btn.dataset.orig; fn(); return; }
  btn.dataset.orig = btn.textContent; btn.dataset.armed="1";
  btn.classList.add("confirm2"); btn.textContent="한번 더 누르면 실행!";
  setTimeout(()=>{ if(btn.dataset.armed){ btn.dataset.armed=""; btn.classList.remove("confirm2"); btn.textContent=btn.dataset.orig; } },3000);
}

/* ================= 넥슨 오픈 API ================= */
const API_BASE = "https://open.api.nexon.com";
function saveApiKey(){
  state.apiKey = document.getElementById("apiKey").value.trim();
  save();
  setMsg("apiMsg","API 키를 저장했어요.","ok");
}
function setMsg(id, text, cls){
  const el = document.getElementById(id);
  el.textContent = text; el.className = "msg " + (cls||"");
}
async function nexonGet(path){
  const res = await fetch(API_BASE + path, { headers: { "x-nxopen-api-key": state.apiKey } });
  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = j?.error?.message || j?.error?.name || ""; }catch(e){}
    throw new Error(`HTTP ${res.status} ${detail}`);
  }
  return res.json();
}
async function fetchCharacterList(){
  const keyInput = document.getElementById("apiKey").value.trim();
  if(keyInput) { state.apiKey = keyInput; save(); }
  if(!state.apiKey){ setMsg("apiMsg","먼저 API 키를 입력해주세요.","err"); return; }
  setMsg("apiMsg","캐릭터 목록을 불러오는 중...","");
  try{
    const data = await nexonGet("/maplestory/v1/character/list");
    const sel = document.getElementById("charSelect");
    sel.innerHTML = "";
    let count = 0;
    (data.account_list||[]).forEach(acc=>{
      (acc.character_list||[]).forEach(c=>{
        const opt = document.createElement("option");
        opt.value = JSON.stringify({name:c.character_name, world:c.world_name, cls:c.character_class, lv:c.character_level, ocid:c.ocid});
        opt.textContent = `${c.character_name} (${c.world_name} · ${c.character_class} · Lv.${c.character_level})`;
        sel.appendChild(opt); count++;
      });
    });
    if(count===0){ setMsg("apiMsg","계정에서 캐릭터를 찾지 못했어요.","err"); return; }
    // 레벨 내림차순 정렬
    [...sel.options].sort((a,b)=>JSON.parse(b.value).lv - JSON.parse(a.value).lv).forEach(o=>sel.appendChild(o));
    document.getElementById("charListArea").style.display = "flex";
    setMsg("apiMsg",`캐릭터 ${count}개를 불러왔어요. 아래에서 선택 후 추가하세요.`,"ok");
  }catch(e){
    setMsg("apiMsg","불러오기 실패: " + e.message + " (키가 올바른지, 유효기간이 남았는지 확인해주세요)","err");
  }
}
function addSelectedCharacter(){
  const sel = document.getElementById("charSelect");
  if(!sel.value) return;
  const c = JSON.parse(sel.value);
  if(state.chars.some(x=>x.name===c.name)){ setMsg("apiMsg",`'${c.name}'은(는) 이미 추가된 캐릭터예요.`,"err"); return; }
  state.chars.push({ id: Date.now()+"" , name:c.name, world:c.world, cls:c.cls, lv:c.lv, records:{} });
  save(); renderAll();
  setMsg("apiMsg",`'${c.name}' 캐릭터를 추가했어요.`,"ok");
}
function addManualCharacter(){
  const name = document.getElementById("manualCharName").value.trim();
  if(!name) return;
  state.chars.push({ id: Date.now()+"", name, world:"", cls:"", lv:"", records:{} });
  document.getElementById("manualCharName").value="";
  save(); renderAll();
}
function removeCharacter(id){
  state.chars = state.chars.filter(c=>c.id!==id);
  delete selectedDay[id];
  save(); renderAll();
}

/* ================= 수익 계산 ================= */
function dayTotal(ch, dateStr){
  const rec = ch.records[dateStr];
  if(!rec) return 0;
  let sum = 0;
  (rec.bosses||[]).forEach(k=>{
    const b = state.bosses.find(x=>bossKey(x)===k);
    if(!b) return;
    const n = (rec.party && rec.party[k]) ? Number(rec.party[k]) : 1;
    sum += Math.floor(b.price / Math.max(1,n));
  });
  (rec.misc||[]).forEach(m=> sum += Number(m.price)||0);
  return sum;
}
function charMonthTotal(ch){
  const prefix = `${viewYear}-${String(viewMonth+1).padStart(2,"0")}-`;
  return Object.keys(ch.records).filter(d=>d.startsWith(prefix)).reduce((s,d)=>s+dayTotal(ch,d),0);
}

/* ================= 캘린더 & 캐릭터 렌더 ================= */
function moveMonth(d){
  viewMonth += d;
  if(viewMonth<0){viewMonth=11;viewYear--;}
  if(viewMonth>11){viewMonth=0;viewYear++;}
  renderAll();
}
function renderAll(){
  renderPriceTable();
  document.getElementById("monthLabel").textContent = `${viewYear}년 ${viewMonth+1}월`;
  const grand = state.chars.reduce((s,c)=>s+charMonthTotal(c),0);
  document.getElementById("grandTotal").textContent = fmt(grand);
  const cont = document.getElementById("charContainer");
  cont.innerHTML = "";
  state.chars.forEach(ch=> cont.appendChild(renderChar(ch)) );
  if(document.getElementById("apiKey").value==="" && state.apiKey) document.getElementById("apiKey").value = state.apiKey;
}
function renderChar(ch){
  const card = document.createElement("div");
  card.className = "card char-card";
  const meta = [ch.world, ch.cls, ch.lv?("Lv."+ch.lv):""].filter(Boolean).join(" · ");
  card.innerHTML = `
    <div class="char-head">
      <div>
        <span class="char-name">${ch.name}</span>
        <span class="char-meta">${meta}</span>
      </div>
      <div class="row">
        <span class="char-sub">${viewMonth+1}월 소계: ${fmt(charMonthTotal(ch))}</span>
        <button class="danger" onclick="confirmTwice(this, ()=>removeCharacter('${ch.id}'))">캐릭터 삭제</button>
      </div>
    </div>`;
  // 캘린더
  const cal = document.createElement("div");
  cal.className = "cal";
  ["일","월","화","수","목","금","토"].forEach(d=>{
    const el = document.createElement("div"); el.className="dow"; el.textContent=d; cal.appendChild(el);
  });
  const first = new Date(viewYear, viewMonth, 1).getDay();
  const days = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  for(let i=0;i<first;i++){ const e=document.createElement("div"); e.className="day empty"; cal.appendChild(e); }
  for(let d=1; d<=days; d++){
    const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const el = document.createElement("div");
    el.className = "day" + (dateStr===todayStr?" today":"") + (selectedDay[ch.id]===dateStr?" selected":"");
    const v = dayTotal(ch,dateStr);
    el.innerHTML = `<div class="dnum">${d}</div>` + (v>0?`<div class="dval">${(v/100000000).toFixed(v>=100000000?1:2)}억</div>`:"");
    el.onclick = ()=>{ selectedDay[ch.id] = (selectedDay[ch.id]===dateStr? null : dateStr); renderAll(); };
    cal.appendChild(el);
  }
  card.appendChild(cal);
  // 날짜 패널
  if(selectedDay[ch.id]) card.appendChild(renderDayPanel(ch, selectedDay[ch.id]));
  return card;
}
function renderDayPanel(ch, dateStr){
  if(!ch.records[dateStr]) ch.records[dateStr] = {bosses:[], misc:[], party:{}};
  const rec = ch.records[dateStr];
  if(!rec.party) rec.party = {};
  const panel = document.createElement("div");
  panel.className = "day-panel";
  panel.innerHTML = `<b>${dateStr}</b> — 이 날 수익: <span style="color:var(--green);font-weight:700">${fmt(dayTotal(ch,dateStr))}</span>
    <div class="row" style="margin-top:8px"><input placeholder="보스 검색..." oninput="this.parentNode.nextElementSibling.querySelectorAll('label').forEach(l=>l.style.display=l.textContent.includes(this.value)?'':'none')" style="flex:1"></div>`;
  // 보스 체크
  const pick = document.createElement("div");
  pick.className = "boss-pick";
  state.bosses.forEach(b=>{
    const k = bossKey(b);
    const on = rec.bosses.includes(k);
    const label = document.createElement("label");
    label.className = on?"on":"";
    const n = rec.party[k] || 1;
    const myShare = Math.floor(b.price / n);
    let partySel = "";
    if(on){
      partySel = ` <select class="party-sel" title="파티 인원수" onclick="event.preventDefault(); event.stopPropagation();">`
        + [1,2,3,4,5,6].map(x=>`<option value="${x}" ${x===n?"selected":""}>${x}인</option>`).join("")
        + `</select>`;
    }
    label.innerHTML = `<input type="checkbox" ${on?"checked":""}> <span class="badge b-${b.diff}">${b.diff}</span> ${b.name} <span class="sub">${on&&n>1 ? myShare.toLocaleString()+" ("+n+"인 분배)" : b.price.toLocaleString()}</span>${partySel}`;
    label.querySelector("input").onchange = (e)=>{
      if(e.target.checked) rec.bosses.push(k);
      else { rec.bosses = rec.bosses.filter(x=>x!==k); delete rec.party[k]; }
      save(); renderAll();
    };
    const sel = label.querySelector("select");
    if(sel){
      sel.onchange = (e)=>{ rec.party[k] = Number(e.target.value); save(); renderAll(); };
      sel.onclick = (e)=>{ e.stopPropagation(); };
    }
    pick.appendChild(label);
  });
  panel.appendChild(pick);
  // 기타 수익
  const miscDiv = document.createElement("div");
  miscDiv.innerHTML = `<div class="sub" style="margin:6px 0">기타 드롭 아이템 판매 수익</div>`;
  rec.misc.forEach((m,i)=>{
    const r = document.createElement("div");
    r.className = "misc-row";
    r.innerHTML = `<input value="${m.item||""}" placeholder="아이템명" style="flex:1">
      <input type="number" value="${m.price||""}" placeholder="판매가(메소)" style="width:150px">
      <button class="danger">✕</button>`;
    const [it, pr, del] = r.children;
    it.onchange = ()=>{ m.item = it.value; save(); };
    pr.onchange = ()=>{ m.price = Number(pr.value)||0; save(); renderAll(); };
    del.onclick = ()=>{ rec.misc.splice(i,1); save(); renderAll(); };
    miscDiv.appendChild(r);
  });
  const addBtn = document.createElement("button");
  addBtn.textContent = "＋ 기타 수익 추가";
  addBtn.onclick = ()=>{ rec.misc.push({item:"", price:0}); save(); renderAll(); };
  miscDiv.appendChild(addBtn);
  panel.appendChild(miscDiv);
  return panel;
}

renderAll();
</script>
</body>
</html>
